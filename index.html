<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FAF9F7">
  <meta name="description" content="悅姿醫美診所零用金備用池系統入口">
  <title>悅姿醫美診所｜零用金備用池</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="./" aria-label="悅姿醫美診所零用金備用池首頁">
        <span class="brand-mark" aria-hidden="true">悅姿</span>
        <span class="brand-copy">
          <strong>悅姿醫美診所</strong>
          <span>零用金備用池</span>
        </span>
      </a>
      <span class="system-status"><span aria-hidden="true"></span>系統入口</span>
    </div>
  </header>

  <main>
    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">PETTY CASH RESERVE</p>
      <h1 id="page-title">零用金備用池</h1>
      <p>請選擇要進入的功能</p>
    </section>

    <section class="actions" aria-label="系統功能">
      <a class="action-card action-card--take" href="https://script.google.com/macros/s/AKfycbwYetPtHl6tm0FDzR_iNkz6mwlZDsFb7V2MZDcVy08c8QXu-IJXvmXM-OH9kj-diwxB5Q/exec?page=take">
        <span class="action-icon" aria-hidden="true"><i data-lucide="wallet-cards"></i></span>
        <span class="action-content">
          <span class="action-label">員工使用</span>
          <strong>取用零用金</strong>
          <span>登錄從備用池取出的各面額數量</span>
        </span>
        <span class="action-arrow" aria-hidden="true"><i data-lucide="arrow-right"></i></span>
      </a>

      <a class="action-card action-card--refill" href="https://script.google.com/macros/s/AKfycbwYetPtHl6tm0FDzR_iNkz6mwlZDsFb7V2MZDcVy08c8QXu-IJXvmXM-OH9kj-diwxB5Q/exec?page=refill">
        <span class="action-icon" aria-hidden="true"><i data-lucide="circle-dollar-sign"></i></span>
        <span class="action-content">
          <span class="action-label">主管使用</span>
          <strong>主管回補</strong>
          <span>登錄回補數量或重新盤點備用池</span>
        </span>
        <span class="action-arrow" aria-hidden="true"><i data-lucide="arrow-right"></i></span>
      </a>

      <a class="action-card action-card--dashboard" href="https://script.google.com/macros/s/AKfycbwYetPtHl6tm0FDzR_iNkz6mwlZDsFb7V2MZDcVy08c8QXu-IJXvmXM-OH9kj-diwxB5Q/exec?page=dashboard">
        <span class="action-icon" aria-hidden="true"><i data-lucide="chart-no-axes-combined"></i></span>
        <span class="action-content">
          <span class="action-label">即時查詢</span>
          <strong>庫存儀表板</strong>
          <span>查看目前金額、面額數量與回補狀態</span>
        </span>
        <span class="action-arrow" aria-hidden="true"><i data-lucide="arrow-right"></i></span>
      </a>
    </section>
  </main>

  <footer>
    <p>悅姿醫美診所｜內部工作系統</p>
  </footer>
</body>
</html>
